name: Build Lumina OS Alpine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Download Alpine netboot
      run: |
        mkdir -p build && cd build
        wget https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/aarch64/alpine-netboot-3.19.9-aarch64.tar.gz
        tar xzf alpine-netboot-3.19.9-aarch64.tar.gz

    - name: Download minirootfs
      run: |
        cd build
        wget https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/aarch64/alpine-minirootfs-3.19.9-aarch64.tar.gz
        mkdir rootfs
        sudo tar xzf alpine-minirootfs-3.19.9-aarch64.tar.gz -C rootfs

    - name: Customize
      run: |
        cd build/rootfs

        echo "lumina" | sudo tee etc/hostname

        sudo tee etc/motd << 'EOF'
        ==============================
               Welcome to Lumina OS
        ==============================
        EOF

        # 自定义 init：挂 tmpfs 让 apk 能写
        sudo tee init << 'EOF'
        #!/bin/sh
        mount -t proc proc /proc
        mount -t sysfs sys /sys
        mount -t devtmpfs dev /dev
        hostname lumina

        # 让 apk 能写
        mount -t tmpfs tmpfs /var/cache/apk
        mount -t tmpfs tmpfs /lib/apk/db
        mount -t tmpfs tmpfs /etc/apk
        mount -t tmpfs tmpfs /tmp

        echo ""
        cat /etc/motd
        echo ""
        echo "提示：输入 lumina-install 打开工具安装器"
        echo ""
        exec /bin/sh
        EOF
        sudo chmod +x init

        # 安装器
        sudo mkdir -p usr/bin
        sudo bash -c 'cat > usr/bin/lumina-install << "SCRIPT"
        #!/bin/sh
        clear
        echo "========================================"
        echo "       Lumina OS 工具安装器"
        echo "========================================"
        echo ""
        echo "  1) nano    文本编辑器"
        echo "  2) htop    系统监视器"
        echo "  3) python3 Python"
        echo "  4) git     版本控制"
        echo "  5) curl    网络工具"
        echo "  6) vim     编辑器"
        echo "  7) 全部安装"
        echo "  0) 退出"
        echo ""
        echo "输入数字："
        read choice

        case $choice in
            1) apk add nano ;;
            2) apk add htop ;;
            3) apk add python3 ;;
            4) apk add git ;;
            5) apk add curl ;;
            6) apk add vim ;;
            7) apk add nano htop python3 git curl vim ;;
            0) exit 0 ;;
            *) echo "无效选择" ;;
        esac

        echo ""
        echo "安装完成！按 Enter 继续..."
        read
        SCRIPT'
        sudo chmod +x usr/bin/lumina-install

    - name: Build squashfs
      run: |
        cd build
        sudo apt-get install -y squashfs-tools
        sudo mksquashfs rootfs rootfs.squashfs -comp gzip -noappend

    - name: Package
      run: |
        cd build
        zip -r lumina-os.zip boot/vmlinuz-virt boot/initramfs-virt boot/modloop-virt rootfs.squashfs

    - name: Upload
      uses: actions/upload-artifact@v4
      if: (!cancelled())
      with:
        name: lumina-os
        path: build/lumina-os.zip
