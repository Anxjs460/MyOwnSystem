name: Build Lumina OS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y wget git bc bison flex libssl-dev make libc6-dev libncurses5-dev rsync cpio unzip python3 file zip

    - name: Clone buildroot
      run: git clone --depth 1 https://github.com/buildroot/buildroot -b 2024.02.x buildroot

    - name: Configure
      run: |
        cd buildroot
        make qemu_aarch64_virt_defconfig

        # 写入想要的配置
        cat >> .config << 'EOF'
        BR2_ROOTFS_OVERLAY="board/qemu/aarch64-virt/rootfs_overlay"
        BR2_TARGET_GENERIC_ISSUE="Welcome to Lumina OS!"
        BR2_TARGET_GENERIC_HOSTNAME="lumina"
        BR2_PACKAGE_E2FSPROGS=y
        BR2_PACKAGE_NANO=y
        BR2_PACKAGE_HTOP=y
        BR2_PACKAGE_WGET=y
        BR2_PACKAGE_BASH=y
        BR2_PACKAGE_SHADOW=y
        BR2_TARGET_GENERIC_GETTY=y
        BR2_TARGET_GENERIC_GETTY_PORT="console"
        EOF

        # 关键：让 Buildroot 自动补全所有依赖
        make olddefconfig

    - name: Installer
      run: |
        cd buildroot
        mkdir -p board/qemu/aarch64-virt/rootfs_overlay/etc/init.d
        cat > board/qemu/aarch64-virt/rootfs_overlay/etc/init.d/S99installer << 'EOF'
        #!/bin/sh
        if [ -f /etc/.installed ]; then exit 0; fi
        clear
        echo "========================================"
        echo "        Lumina OS Installer"
        echo "========================================"
        echo ""
        TARGET=/dev/vdb
        if [ ! -b "$TARGET" ]; then
            echo "未检测到目标磁盘 $TARGET"
            touch /etc/.installed
            exit 0
        fi
        echo "检测到 $TARGET，输入 yes 格式化并安装："
        read confirm
        [ "$confirm" != "yes" ] && touch /etc/.installed && exit 0
        echo "设置 root 密码："
        read -s password
        echo "root:$password" | chpasswd
        echo "设置主机名："
        read hostname
        echo "$hostname" > /etc/hostname
        mkfs.ext4 -F "$TARGET"
        mkdir -p /mnt/target
        mount "$TARGET" /mnt/target
        for d in bin etc lib lib64 opt root sbin usr var; do
            [ -d "/$d" ] && cp -a "/$d" /mnt/target/
        done
        umount /mnt/target
        touch /etc/.installed
        echo "安装完成，按 Enter 重启..."
        read
        reboot
        EOF
        chmod +x board/qemu/aarch64-virt/rootfs_overlay/etc/init.d/S99installer

    - name: Compile
      run: |
        cd buildroot
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: Package
      run: |
        cd buildroot/output/images
        zip -r lumina-os.zip Image rootfs.ext4 2>/dev/null || true

    - name: Upload
      uses: actions/upload-artifact@v4
      if: (!cancelled())
      with:
        name: lumina-os
        path: buildroot/output/images/lumina-os.zip
