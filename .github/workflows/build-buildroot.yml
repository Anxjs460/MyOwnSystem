name: Build Lumina OS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y wget git bc bison flex libssl-dev make libc6-dev libncurses5-dev rsync cpio unzip python3 file zip

    - name: Clone buildroot
      run: git clone --depth 1 https://github.com/buildroot/buildroot -b 2024.02.x buildroot

    - name: Configure
      run: |
        cd buildroot
        make qemu_aarch64_virt_defconfig

        echo 'BR2_ROOTFS_OVERLAY="board/qemu/aarch64-virt/rootfs_overlay"' >> .config
        echo 'BR2_TARGET_GENERIC_ISSUE="Welcome to Lumina OS!"' >> .config
        echo 'BR2_TARGET_GENERIC_HOSTNAME="lumina"' >> .config

        # ---- e2fsprogs 的完整依赖链 ----
        echo 'BR2_PACKAGE_ZLIB=y' >> .config
        echo 'BR2_PACKAGE_LIBCAP=y' >> .config
        echo 'BR2_PACKAGE_UTIL_LINUX=y' >> .config
        echo 'BR2_PACKAGE_UTIL_LINUX_BINARIES=y' >> .config
        echo 'BR2_PACKAGE_E2FSPROGS=y' >> .config

        # ---- 基础依赖 ----
        echo 'BR2_PACKAGE_NCURSES=y' >> .config
        echo 'BR2_PACKAGE_READLINE=y' >> .config
        echo 'BR2_PACKAGE_SHADOW=y' >> .config

        # ---- 常用工具 ----
        echo 'BR2_PACKAGE_NANO=y' >> .config
        echo 'BR2_PACKAGE_HTOP=y' >> .config
        echo 'BR2_PACKAGE_WGET=y' >> .config
        echo 'BR2_PACKAGE_BASH=y' >> .config

        echo 'BR2_TARGET_GENERIC_GETTY=y' >> .config
        echo 'BR2_TARGET_GENERIC_GETTY_PORT="console"' >> .config

    - name: Installer
      run: |
        cd buildroot
        mkdir -p board/qemu/aarch64-virt/rootfs_overlay/etc/init.d
        cat > board/qemu/aarch64-virt/rootfs_overlay/etc/init.d/S99installer << 'EOF'
        #!/bin/sh
        if [ -f /etc/.installed ]; then exit 0; fi

        clear
        echo "========================================"
        echo "        Lumina OS Installer"
        echo "========================================"
        echo ""
        echo "欢迎使用 Lumina OS 安装器！"
        echo ""

        TARGET=/dev/vdb

        if [ ! -b "$TARGET" ]; then
            echo "未检测到目标磁盘 $TARGET"
            echo "按 Enter 继续使用 Live 模式..."
            read
            touch /etc/.installed
            exit 0
        fi

        echo "检测到目标磁盘：$TARGET"
        echo "⚠️  警告：安装将格式化 $TARGET！"
        echo "输入 yes 开始安装："
        read confirm
        if [ "$confirm" != "yes" ]; then
            echo "已取消。"
            touch /etc/.installed
            exit 0
        fi

        echo "请输入 root 密码："
        read -s password
        echo "root:$password" | chpasswd

        echo "请输入主机名："
        read hostname
        echo "$hostname" > /etc/hostname

        echo ">>> 格式化 $TARGET ..."
        mkfs.ext4 -F "$TARGET"

        echo ">>> 挂载并复制文件 ..."
        mkdir -p /mnt/target
        mount "$TARGET" /mnt/target

        for d in bin etc lib lib64 opt root sbin usr var; do
            [ -d "/$d" ] && cp -a "/$d" /mnt/target/
        done

        umount /mnt/target
        touch /etc/.installed

        echo ""
        echo "========================================"
        echo "  Lumina OS 安装完成！"
        echo "========================================"
        echo "按 Enter 重启..."
        read
        reboot
        EOF
        chmod +x board/qemu/aarch64-virt/rootfs_overlay/etc/init.d/S99installer

    - name: Compile
      run: |
        cd buildroot
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: Package
      run: |
        cd buildroot/output/images
        zip -r lumina-os.zip Image rootfs.ext4 2>/dev/null || true

    - name: Upload
      uses: actions/upload-artifact@v4
      if: (!cancelled())
      with:
        name: lumina-os
        path: buildroot/output/images/lumina-os.zip
