name: Build Lumina OS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y wget git bc bison flex libssl-dev make libc6-dev libncurses5-dev rsync cpio unzip python3 file zip

    - name: Clone buildroot
      run: git clone --depth 1 https://github.com/buildroot/buildroot -b 2024.02.x buildroot

    - name: Configure Buildroot kernel only
      run: |
        cd buildroot
        make qemu_aarch64_virt_defconfig

        # 只要内核，不要 rootfs
        echo '# BR2_TARGET_ROOTFS_EXT2 is not set' >> .config
        echo 'BR2_LINUX_KERNEL_EXT4_FS=y' >> .config
        echo 'BR2_LINUX_KERNEL_EXT2_FS=y' >> .config
        echo 'BR2_LINUX_KERNEL_VIRTIO=y' >> .config
        echo 'BR2_LINUX_KERNEL_VIRTIO_BLK=y' >> .config
        echo 'BR2_LINUX_KERNEL_VIRTIO_NET=y' >> .config

        make olddefconfig

    - name: Compile kernel
      run: |
        cd buildroot
        make linux -j$(nproc) || make linux -j1

    - name: Download Alpine minirootfs
      run: |
        cd buildroot
        wget https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/aarch64/alpine-minirootfs-3.19.9-aarch64.tar.gz
        mkdir alpine-rootfs
        sudo tar xzf alpine-minirootfs-3.19.9-aarch64.tar.gz -C alpine-rootfs

    - name: Customize Alpine rootfs
      run: |
        cd buildroot/alpine-rootfs

        echo "lumina" | sudo tee etc/hostname

        sudo tee etc/motd << 'EOF'
        ==============================
               Welcome to Lumina OS
        ==============================
        EOF

        sudo mkdir -p usr/bin
        sudo bash -c 'cat > usr/bin/lumina-install << "SCRIPT"
        #!/bin/sh
        clear
        echo "========================================"
        echo "       Lumina OS 工具安装器"
        echo "========================================"
        echo ""
        echo "  1) nano    文本编辑器"
        echo "  2) htop    系统监视器"
        echo "  3) python3 Python"
        echo "  4) git     版本控制"
        echo "  5) curl    网络工具"
        echo "  6) vim     编辑器"
        echo "  7) 全部安装"
        echo "  0) 退出"
        echo ""
        echo "输入数字："
        read choice

        case $choice in
            1) apk add nano ;;
            2) apk add htop ;;
            3) apk add python3 ;;
            4) apk add git ;;
            5) apk add curl ;;
            6) apk add vim ;;
            7) apk add nano htop python3 git curl vim ;;
            0) exit 0 ;;
            *) echo "无效选择" ;;
        esac

        echo ""
        echo "安装完成！按 Enter 继续..."
        read
        SCRIPT'
        sudo chmod +x usr/bin/lumina-install

        # 可写层
        sudo tee init << 'EOF'
        #!/bin/sh
        mount -t proc proc /proc
        mount -t sysfs sys /sys
        mount -t devtmpfs dev /dev
        hostname lumina
        echo ""
        cat /etc/motd
        echo ""
        echo "提示：输入 lumina-install 打开工具安装器"
        echo ""
        exec /bin/sh
        EOF
        sudo chmod +x init

    - name: Build ext4 rootfs
      run: |
        cd buildroot
        dd if=/dev/zero of=rootfs.ext4 bs=1M count=200
        mkfs.ext4 -F rootfs.ext4
        mkdir -p mnt
        sudo mount -o loop rootfs.ext4 mnt
        sudo cp -a alpine-rootfs/* mnt/
        sudo umount mnt

    - name: Package
      run: |
        cd buildroot
        zip -r lumina-os.zip output/images/Image rootfs.ext4

    - name: Upload
      uses: actions/upload-artifact@v4
      if: (!cancelled())
      with:
        name: lumina-os
        path: buildroot/lumina-os.zip
