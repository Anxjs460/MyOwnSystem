name: Build Lumina OS Installer

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  REPO_URL: https://github.com/buildroot/buildroot
  REPO_BRANCH: 2024.02.x
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y wget git bc bison flex libssl-dev make libc6-dev libncurses5-dev rsync cpio unzip python3 file zip
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH buildroot

    - name: Configure Lumina OS
      run: |
        cd buildroot
        make qemu_aarch64_virt_defconfig

        # 把 overlay 打包进镜像
        echo 'BR2_ROOTFS_OVERLAY="board/qemu/aarch64-virt/rootfs_overlay"' >> .config

        # 系统名字
        echo 'BR2_TARGET_GENERIC_ISSUE="Welcome to Lumina OS!"' >> .config
        echo 'BR2_TARGET_GENERIC_HOSTNAME="lumina"' >> .config

        # 依赖库
        echo 'BR2_PACKAGE_NCURSES=y' >> .config
        echo 'BR2_PACKAGE_READLINE=y' >> .config
        echo 'BR2_PACKAGE_SHADOW=y' >> .config
        echo 'BR2_PACKAGE_ZLIB=y' >> .config

        # 安装器需要的工具
        echo 'BR2_PACKAGE_E2FSPROGS=y' >> .config
        echo 'BR2_PACKAGE_UTIL_LINUX=y' >> .config
        echo 'BR2_PACKAGE_UTIL_LINUX_BINARIES=y' >> .config
        echo 'BR2_PACKAGE_DOSFSTOOLS=y' >> .config

        # 常用工具
        echo 'BR2_PACKAGE_NANO=y' >> .config
        echo 'BR2_PACKAGE_VIM=y' >> .config
        echo 'BR2_PACKAGE_HTOP=y' >> .config
        echo 'BR2_PACKAGE_PYTHON3=y' >> .config
        echo 'BR2_PACKAGE_GIT=y' >> .config
        echo 'BR2_PACKAGE_WGET=y' >> .config
        echo 'BR2_PACKAGE_CURL=y' >> .config
        echo 'BR2_PACKAGE_BASH=y' >> .config
        echo 'BR2_PACKAGE_LESS=y' >> .config
        echo 'BR2_PACKAGE_TAR=y' >> .config
        echo 'BR2_PACKAGE_UNZIP=y' >> .config
        echo 'BR2_PACKAGE_ZIP=y' >> .config
        echo 'BR2_PACKAGE_CA_CERTIFICATES=y' >> .config

        # root 登录
        echo 'BR2_TARGET_GENERIC_GETTY=y' >> .config
        echo 'BR2_TARGET_GENERIC_GETTY_PORT="console"' >> .config

    - name: Add Lumina installer
      run: |
        cd buildroot
        mkdir -p board/qemu/aarch64-virt/rootfs_overlay/etc/init.d

        cat > board/qemu/aarch64-virt/rootfs_overlay/etc/init.d/S99installer << 'EOF'
        #!/bin/sh

        if [ -f /etc/.installed ]; then
            exit 0
        fi

        clear
        echo "========================================"
        echo "        Lumina OS Installer"
        echo "========================================"
        echo ""
        echo "欢迎使用 Lumina OS 安装器！"
        echo "本安装器会把 Lumina OS 安装到第二块磁盘。"
        echo ""

        TARGET=/dev/vdb

        if [ ! -b "$TARGET" ]; then
            echo "未检测到目标磁盘 $TARGET"
            echo "请确保 QEMU 启动时挂载了第二块空白磁盘。"
            echo ""
            echo "按 Enter 继续使用 Live 模式..."
            read
            touch /etc/.installed
            exit 0
        fi

        echo "检测到目标磁盘：$TARGET"
        echo ""
        echo "⚠️  警告：安装将格式化 $TARGET，所有数据会丢失！"
        echo ""
        echo "输入 yes 开始安装，其他任意键取消："
        read confirm

        if [ "$confirm" != "yes" ]; then
            echo "已取消安装。"
            touch /etc/.installed
            exit 0
        fi

        echo ""
        echo ">>> 第一步：设置 root 密码"
        echo "请输入 root 密码："
        read -s password
        echo "root:$password" | chpasswd

        echo ""
        echo ">>> 第二步：设置主机名"
        echo "请输入主机名："
        read hostname
        echo "$hostname" > /etc/hostname
        hostname "$hostname"

        echo ""
        echo ">>> 第三步：分区"
        parted -s "$TARGET" mklabel msdos
        parted -s "$TARGET" mkpart primary ext4 1MiB 100%
        sleep 1

        echo ">>> 第四步：格式化"
        mkfs.ext4 -F "${TARGET}1"

        echo ">>> 第五步：挂载目标盘"
        mkdir -p /mnt/target
        mount "${TARGET}1" /mnt/target

        echo ">>> 第六步：复制系统文件"
        for dir in bin etc lib lib64 opt root sbin usr var; do
            if [ -d "/$dir" ]; then
                cp -a "/$dir" /mnt/target/
            fi
        done

        echo ">>> 第七步：安装引导"
        dd if=/dev/vda of="$TARGET" bs=512 count=1 conv=notrunc 2>/dev/null

        echo ">>> 第八步：卸载"
        umount /mnt/target

        touch /etc/.installed

        echo ""
        echo "========================================"
        echo "  Lumina OS 安装完成！"
        echo "========================================"
        echo ""
        echo "请关闭 QEMU，从目标盘启动。"
        echo "按 Enter 重启..."
        read
        reboot
        EOF

        chmod +x board/qemu/aarch64-virt/rootfs_overlay/etc/init.d/S99installer

    - name: Compile Lumina OS
      id: compile
      run: |
        cd buildroot
        echo ">>> Compiling Lumina OS..."
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: Package ZIP
      run: |
        cd buildroot/output/images
        zip -r lumina-os.zip Image rootfs.ext4 2>/dev/null || true

    - name: Upload Lumina OS
      uses: actions/upload-artifact@v4
      if: (!cancelled())
      with:
        name: lumina-os
        path: buildroot/output/images/lumina-os.zip
