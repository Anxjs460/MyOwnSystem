name: Build Lumina OS Alpine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Download Alpine
      run: |
        mkdir -p build && cd build
        wget https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/aarch64/alpine-minirootfs-3.19.1-aarch64.tar.gz
        wget https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/aarch64/netboot/vmlinuz-virt
        wget https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/aarch64/netboot/initramfs-virt
        mkdir rootfs
        sudo tar xzf alpine-minirootfs-3.19.1-aarch64.tar.gz -C rootfs

    - name: Customize
      run: |
        cd build/rootfs
        echo "lumina" | sudo tee etc/hostname
        sudo tee etc/motd << 'EOF'
        ==============================
               Welcome to Lumina OS
        ==============================
        EOF

        sudo tee usr/local/bin/lumina-install << 'EOF'
        #!/bin/sh
        clear
        echo "========================================"
        echo "       Lumina OS 工具安装器"
        echo "========================================"
        echo ""
        echo "  1) nano    文本编辑器"
        echo "  2) htop    系统监视器"
        echo "  3) python3 Python"
        echo "  4) git     版本控制"
        echo "  5) curl    网络工具"
        echo "  6) vim     编辑器"
        echo "  7) 全部安装"
        echo "  0) 退出"
        echo ""
        echo "输入数字："
        read choice

        case $choice in
            1) apk add nano ;;
            2) apk add htop ;;
            3) apk add python3 ;;
            4) apk add git ;;
            5) apk add curl ;;
            6) apk add vim ;;
            7) apk add nano htop python3 git curl vim ;;
            0) exit 0 ;;
            *) echo "无效选择" ;;
        esac

        echo ""
        echo "安装完成！按 Enter 继续..."
        read
        EOF

        sudo chmod +x usr/local/bin/lumina-install

        sudo tee etc/profile.d/lumina.sh << 'EOF'
        echo ""
        echo "提示：输入 lumina-install 打开工具安装器"
        echo ""
        EOF

    - name: Build ext4
      run: |
        cd build
        dd if=/dev/zero of=rootfs.img bs=1M count=200
        mkfs.ext4 -F rootfs.img
        mkdir -p mnt
        sudo mount -o loop rootfs.img mnt
        sudo cp -a rootfs/* mnt/
        sudo umount mnt

    - name: Package
      run: |
        cd build
        zip -r lumina-os.zip vmlinuz-virt initramfs-virt rootfs.img

    - name: Upload
      uses: actions/upload-artifact@v4
      if: (!cancelled())
      with:
        name: lumina-os
        path: build/lumina-os.zip
